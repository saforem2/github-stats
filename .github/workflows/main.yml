name: Generate Stats Images

on:
  push:
    branches: [ master ]
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Check out repository under $GITHUB_WORKSPACE, so the job can access it
    - uses: actions/checkout@v3

    # Run using Python 3.8 for consistency and aiohttp
    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        architecture: 'x64'
        cache: 'pip'

    # Install dependencies with `pip`
    - name: Install requirements
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install -r requirements.txt

    # Generate all statistics images
    - name: Generate images
      run: |
        python3 --version
        python3 generate_images.py
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EXCLUDED: ${{ secrets.EXCLUDED }}
        EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
        EXCLUDE_FORKED_REPOS: false

    # Commit all changed files to the repository
    - name: Commit to the repo
      run: |
        git config --global user.name "saforem2/github-stats"
        git config --global user.email "github-stats[bot]@saforem2.github.io"
        git add .
        # Only commit when something actually changed. `git commit || true`
        # would also swallow a genuine commit failure and let the job push
        # stale assets, so check the index explicitly instead.
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m 'Update generated files'
        fi
        # Commit before pulling: the freshly generated SVGs are local changes,
        # so pulling first aborts with "local changes would be overwritten"
        # whenever master moved while this job was running.
        #
        # -X theirs resolves conflicts in favour of the commit being replayed
        # (this run's output). Two runs overlapping both regenerate the same
        # SVGs, which conflicts on every rebase; the newest render is always
        # the one we want, and these files are generated, never hand-edited.
        git pull --rebase -X theirs
        git push
