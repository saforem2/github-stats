name: Generate Stats Images

on:
  push:
    branches: [ master ]
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Check out repository under $GITHUB_WORKSPACE, so the job can access it
    - uses: actions/checkout@v3

    # Run using Python 3.8 for consistency and aiohttp
    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        architecture: 'x64'
        cache: 'pip'

    # Install dependencies with `pip`
    - name: Install requirements
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install -r requirements.txt

    # Generate all statistics images
    - name: Generate images
      run: |
        python3 --version
        python3 generate_images.py
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EXCLUDED: ${{ secrets.EXCLUDED }}
        EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
        EXCLUDE_FORKED_REPOS: false

    # Refuse to publish obviously-empty output. generate_images.py now fails
    # loudly on a rejected token, but this is the last line of defence: any
    # future path that degrades to a "No Name" / all-zero badge must not be
    # committed over the real statistics.
    - name: Sanity check generated images
      run: |
        for f in generated/overview.svg generated/languages.svg; do
          if [ ! -s "$f" ]; then
            echo "::error::$f is missing or empty."
            exit 1
          fi
        done
        if grep -q "No Name" generated/overview.svg; then
          echo "::error::overview.svg fell back to 'No Name' -- the API"
          echo "::error::returned no user data. Refusing to commit."
          exit 1
        fi
        # A real account has a non-zero figure somewhere in the table; an
        # all-zero table means every query silently came back empty.
        if ! grep -qE "<td>[1-9][0-9,]*</td>" generated/overview.svg; then
          echo "::error::Every statistic in overview.svg is zero."
          echo "::error::Refusing to commit over the previous good values."
          exit 1
        fi
        if ! grep -q 'class="lang"' generated/languages.svg; then
          echo "::error::languages.svg contains no languages."
          exit 1
        fi
        echo "Generated images look sane."

    # Commit all changed files to the repository
    - name: Commit to the repo
      run: |
        git config --global user.name "saforem2/github-stats"
        git config --global user.email "github-stats[bot]@saforem2.github.io"
        git add .
        # Only commit when something actually changed. `git commit || true`
        # would also swallow a genuine commit failure and let the job push
        # stale assets, so check the index explicitly instead.
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m 'Update generated files'
        fi
        # Commit before pulling: the freshly generated SVGs are local changes,
        # so pulling first aborts with "local changes would be overwritten"
        # whenever master moved while this job was running.
        #
        # -X theirs resolves conflicts in favour of the commit being replayed
        # (this run's output). Two runs overlapping both regenerate the same
        # SVGs, which conflicts on every rebase; the newest render is always
        # the one we want, and these files are generated, never hand-edited.
        git pull --rebase -X theirs
        git push
